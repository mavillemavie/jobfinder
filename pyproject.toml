[project]
name = "jobfinder"
version = "0.1.0"
description = "A personal job-search machine: discover, score, contact, tailor, brief — locally"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "ruamel.yaml>=0.18",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "jsonschema>=4.22",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "anthropic>=1.3.0",
    "reportlab>=4.2",
    "pypdf>=4.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5", "respx>=0.21"]

[project.scripts]
jobfinder = "jobfinder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits a real external service; skipped without keys"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and form fields as call defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query", "typer.Option", "typer.Argument"]
