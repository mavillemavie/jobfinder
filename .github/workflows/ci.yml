name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      # First-run smoke on a clean checkout: schema, profile from the example, health report.
      - run: uv run jobfinder db upgrade
      - run: uv run jobfinder doctor
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in "run.ps1", "stop.ps1") {
            $t = $null; $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$t, [ref]$e) | Out-Null
            if ($e) { $e; exit 1 }
          }
          .\stop.ps1
